name: Android CI

# Builds the app exactly like a release: unit tests, lint, debug APK, instrumented-test APK and the
# release Android App Bundle (.aab). Download the AAB from the run's "Artifacts" section.
#
# To get a SIGNED, upload-ready AAB, add these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    your upload keystore, base64-encoded (e.g. `base64 -w0 upload-keystore.jks`)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the AAB is built unsigned (fine for verification, not for upload).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Print Room schema (commit app/schemas/ to keep a migration baseline)
        run: |
          for f in app/schemas/*/*.json; do echo "== $f"; cat "$f"; echo; done

      - name: Lint (release)
        run: ./gradlew --console=plain lintRelease

      - name: Assemble debug APK + compile instrumented tests
        run: ./gradlew --console=plain assembleDebug assembleDebugAndroidTest

      - name: Decode upload keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Signing with the configured upload keystore."
          else
            echo "No KEYSTORE_BASE64 secret: the AAB will be unsigned."
          fi

      - name: Bundle release (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain bundleRelease

      - name: Inspect release (permissions, AAB size and checksum)
        run: |
          echo "== Permissions in the merged release manifest =="
          find app/build/intermediates -path "*merged_manifest*" -path "*elease*" -name AndroidManifest.xml | head -1 | xargs -r grep -ho 'uses-permission[^>]*android:name="[^"]*"' | sed 's/.*android:name=//' | sort -u
          echo "== AAB =="
          ls -l app/build/outputs/bundle/release/*.aab
          sha256sum app/build/outputs/bundle/release/*.aab
          unzip -l app/build/outputs/bundle/release/*.aab | tail -n 3
          echo "== Where each permission comes from (manifest merger report) =="
          report=app/build/outputs/logs/manifest-merger-release-report.txt
          for perm in INTERNET ACCESS_NETWORK_STATE FOREGROUND_SERVICE WAKE_LOCK; do
            grep -h -A2 "uses-permission#android.permission.$perm\$" "$report" | head -3 || true
          done
          echo "== Native libraries in the AAB: Google Play requires 16 KB ELF alignment (LOAD align 0x4000 or more) =="
          libs=$(mktemp -d)
          unzip -q -o app/build/outputs/bundle/release/*.aab 'base/lib/arm64-v8a/*.so' 'base/lib/x86_64/*.so' -d "$libs"
          status=ok
          while read -r lib; do
            aligns=$(readelf -lW "$lib" | awk '$1 == "LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            echo "${lib#"$libs"/}: $aligns"
            for a in $aligns; do
              if [ $((a)) -lt 16384 ]; then status=NOT_ALIGNED; fi
            done
          done < <(find "$libs" -name '*.so' | sort)
          echo "16 KB alignment: $status"
          [ "$status" = ok ]

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackly-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore
