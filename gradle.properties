# =============================================================================
#  TRACKLY PROJECT CONFIGURATION  —  the one place to edit before publishing
# =============================================================================

# Google Play package name (applicationId): permanent once the app is uploaded to Play Console.
# Source-code packages stay "com.example.trackly" — only this value is what Google Play sees.
TRACKLY_APPLICATION_ID=io.github.miamotoatoshi.trackly

# Version shown to users and the monotonically increasing build number.
TRACKLY_VERSION_NAME=1.0.0
TRACKLY_VERSION_CODE=1

# Google Play subscription product ID (Play Console > Monetize > Subscriptions).
# Give it two base plans: a monthly one (e.g. "monthly") and a yearly one (e.g. "yearly");
# the paywall shows every active base plan it finds. Prices are NOT configured here —
# they are read from Google Play at runtime.
BILLING_PREMIUM_PRODUCT_ID=trackly_premium

# Optional one-time "Premium forever" product (Play Console > Monetize > In-app products).
# Leave empty to sell subscriptions only. If the product is not published yet, the
# paywall simply hides the lifetime option.
BILLING_LIFETIME_PRODUCT_ID=trackly_premium_lifetime

# Shown in the in-app Privacy Policy / Terms and used by "Send feedback".
# DEVELOPER_NAME: your name or company as on Google Play. SUPPORT_EMAIL: the contact e-mail
# you also enter in Play Console. Left empty, the texts refer to Trackly's Google Play page instead.
DEVELOPER_NAME=
SUPPORT_EMAIL=
# Date the bundled Privacy Policy / Terms take effect (ISO yyyy-mm-dd). Update it when you change them.
LEGAL_EFFECTIVE_DATE=2026-11-25

# Public URLs of your hosted legal pages (e.g. the website in website/, published with GitHub Pages).
# If empty, the app shows the bundled Privacy Policy / Terms (res/values*/legal.xml).
PRIVACY_POLICY_URL=
TERMS_OF_SERVICE_URL=

# -----------------------------------------------------------------------------
# Release signing is NOT configured here (never commit secrets). Provide
# KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD through environment
# variables or ~/.gradle/gradle.properties. See README.md > "Signing".
# -----------------------------------------------------------------------------

# Build environment
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
