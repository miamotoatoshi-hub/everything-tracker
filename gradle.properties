# =============================================================================
#  TRACKLY PROJECT CONFIGURATION  —  the one place to edit before publishing
# =============================================================================

# Google Play package name (applicationId). Google Play REJECTS "com.example.*",
# so replace this before uploading to Play Console. Source-code packages stay
# "com.example.trackly" — only this value is what Google Play sees.
TRACKLY_APPLICATION_ID=com.example.trackly

# Version shown to users and the monotonically increasing build number.
TRACKLY_VERSION_NAME=1.0.0
TRACKLY_VERSION_CODE=1

# Google Play subscription product ID (Play Console > Monetize > Subscriptions).
# The price is NOT configured here — it is read from Google Play at runtime.
BILLING_PREMIUM_PRODUCT_ID=trackly_premium_monthly

# Public URLs of your legal documents. If empty, the app shows the bundled
# placeholder screens instead (replace the TODO text in res/values/legal.xml).
PRIVACY_POLICY_URL=
TERMS_OF_SERVICE_URL=

# -----------------------------------------------------------------------------
# Release signing is NOT configured here (never commit secrets). Provide
# KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD through environment
# variables or ~/.gradle/gradle.properties. See README.md > "Signing".
# -----------------------------------------------------------------------------

# Build environment
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
